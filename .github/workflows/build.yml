# ============================================================
# AirLLM Chat - Manual/On-Demand Build
#
# Triggers: Manual (workflow_dispatch) or push to main
# Purpose:  Build binaries for testing without creating a release
# Downloads: Available as GitHub Actions artifacts (14 days)
# ============================================================

name: Build

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows .exe'
        required: false
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux binary'
        required: false
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS binary'
        required: false
        type: boolean
        default: true
      model:
        description: 'Default model path (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-windows:
    name: 🪟 Windows x64
    if: ${{ github.event.inputs.build_windows == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install airllm torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller

      - name: Build
        run: pyinstaller airllm-chat.spec --clean --noconfirm

      - name: Package
        run: |
          cd dist/airllm-chat
          7z a -tzip ..\airllm-chat-windows-x64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: airllm-chat-windows-x64
          path: dist/airllm-chat-windows-x64.zip

  build-linux:
    name: 🐧 Linux x64
    if: ${{ github.event.inputs.build_linux == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install airllm torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller

      - name: Build
        run: pyinstaller airllm-chat.spec --clean --noconfirm

      - name: Package
        run: |
          cd dist/airllm-chat
          tar -czf ../airllm-chat-linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: airllm-chat-linux-x64
          path: dist/airllm-chat-linux-x64.tar.gz

  build-macos:
    name: 🍎 macOS
    if: ${{ github.event.inputs.build_macos == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install airllm torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller

      - name: Build
        run: pyinstaller airllm-chat.spec --clean --noconfirm

      - name: Package
        run: |
          cd dist/airllm-chat
          zip -r ../airllm-chat-macos.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: airllm-chat-macos
          path: dist/airllm-chat-macos.zip
