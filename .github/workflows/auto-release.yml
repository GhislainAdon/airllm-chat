# ============================================================
# AirLLM Chat - Auto Release Pipeline
#
# Triggers: Successful CI completion on main branch
# Flow:     CI passes → bump VERSION → commit + tag → build → release
# Version:  Reads from VERSION file, auto-increments patch
# ============================================================

name: Auto Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

env:
  APP_NAME: airllm-chat
  PYTHON_VERSION: '3.11'

jobs:
  # ==============================================
  # JOB 1: Bump version, create tag, push back
  # ==============================================
  bump-version:
    name: 🔖 Bump Version
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check if last commit is a version bump (prevent loop)
        id: check_loop
        run: |
          LAST_MSG=$(git log -1 --pretty=%s)
          echo "Last commit message: $LAST_MSG"
          if echo "$LAST_MSG" | grep -q "chore(release)"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping — last commit was a version bump"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Read current version
        if: steps.check_loop.outputs.skip != 'true'
        id: current
        run: |
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT"

      - name: Bump patch version
        if: steps.check_loop.outputs.skip != 'true'
        id: bump
        run: |
          CURRENT="${{ steps.current.outputs.current_version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_TAG="v${NEW_VERSION}"
          echo "$NEW_VERSION" > VERSION
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Bumped: $CURRENT → $NEW_VERSION ($NEW_TAG)"

      - name: Commit version bump and push tag
        if: steps.check_loop.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.new_version }}"
          git tag -a "${{ steps.bump.outputs.new_tag }}" -m "Release ${{ steps.bump.outputs.new_tag }}"
          git push "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:main --follow-tags

  # ==============================================
  # JOB 2: Build Windows .exe (64-bit)
  # ==============================================
  build-windows:
    name: 🪟 Windows x64
    needs: bump-version
    if: needs.bump-version.outputs.new_tag != ''
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install airllm torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller airllm-chat.spec --clean --noconfirm

      - name: Create ZIP archive
        run: |
          cd dist/airllm-chat
          7z a -tzip ..\airllm-chat-windows-x64.zip .
          cd ../..

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/airllm-chat-windows-x64.zip
          retention-days: 5

  # ==============================================
  # JOB 3: Build Linux binary
  # ==============================================
  build-linux:
    name: 🐧 Linux x64
    needs: bump-version
    if: needs.bump-version.outputs.new_tag != ''
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev \
            libgl1-mesa-glx \
            patchelf \
            file \
            desktop-file-utils \
            fuse \
            fuse2fs \
            AppImageKit || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install airllm torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller airllm-chat.spec --clean --noconfirm

      - name: Create tar.gz archive
        run: |
          cd dist/airllm-chat
          tar -czf ../airllm-chat-linux-x64.tar.gz .
          cd ../..

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/airllm-chat-linux-x64.tar.gz
          retention-days: 5

  # ==============================================
  # JOB 4: Build macOS app bundle
  # ==============================================
  build-macos:
    name: 🍎 macOS x64 / ARM64
    needs: bump-version
    if: needs.bump-version.outputs.new_tag != ''
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install airllm torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller
          pip install py2app || true

      - name: Build with PyInstaller
        run: |
          pyinstaller airllm-chat.spec --clean --noconfirm

      - name: Create ZIP archive
        run: |
          cd dist/airllm-chat
          zip -r ../airllm-chat-macos.zip .
          cd ../..

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/airllm-chat-macos.zip
          retention-days: 5

  # ==============================================
  # JOB 5: Source distribution
  # ==============================================
  build-source:
    name: 📦 Source
    needs: bump-version
    if: needs.bump-version.outputs.new_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_tag }}

      - name: Create source tarball
        run: |
          tar --exclude='.git' \
              --exclude='venv' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='.DS_Store' \
              --exclude='build' \
              --exclude='dist' \
              -czf ../airllm-chat-src.tar.gz .

          zip -r ../airllm-chat-src.zip . \
            -x '.git/*' \
            -x 'venv/*' \
            -x '__pycache__/*' \
            -x '*.pyc' \
            -x '.DS_Store' \
            -x 'build/*' \
            -x 'dist/*'

          mv ../airllm-chat-src.tar.gz ./airllm-chat-src.tar.gz
          mv ../airllm-chat-src.zip ./airllm-chat-src.zip

      - name: Generate SHA256 checksums
        run: |
          sha256sum airllm-chat-src.tar.gz > airllm-chat-src.tar.gz.sha256
          sha256sum airllm-chat-src.zip > airllm-chat-src.zip.sha256

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            airllm-chat-src.tar.gz
            airllm-chat-src.tar.gz.sha256
            airllm-chat-src.zip
            airllm-chat-src.zip.sha256
          retention-days: 5

  # ==============================================
  # JOB 6: Create GitHub Release with all artifacts
  # ==============================================
  release:
    name: 🚀 Create Release
    needs:
      - bump-version
      - build-windows
      - build-linux
      - build-macos
      - build-source
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_tag }}

      # Download all build artifacts
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-artifacts/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release-artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: release-artifacts/

      - name: Download Source artifact
        uses: actions/download-artifact@v4
        with:
          name: source
          path: release-artifacts/

      - name: Generate final checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          echo "## Checksums (SHA256)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate auto release notes
        id: notes
        run: |
          VERSION="${{ needs.bump-version.outputs.new_version }}"
          TAG="${{ needs.bump-version.outputs.new_tag }}"
          DATE=$(date +%Y-%m-%d)

          # Get the commit log since the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "- Release $TAG")
          else
            COMMITS=$(git log -10 --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Build the release notes dynamically
          {
            echo "## What's Changed in ${TAG}"
            echo ""
            echo "${COMMITS}"
            echo ""
            echo "---"
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| Windows x64 | \`airllm-chat-windows-x64.zip\` |"
            echo "| Linux x64 | \`airllm-chat-linux-x64.tar.gz\` |"
            echo "| macOS | \`airllm-chat-macos.zip\` |"
            echo "| Source (tar.gz) | \`airllm-chat-src.tar.gz\` |"
            echo "| Source (zip) | \`airllm-chat-src.zip\` |"
            echo ""
            echo "### Quick Start"
            echo ""
            echo '```bash'
            echo "# Linux / macOS"
            echo "tar -xzf airllm-chat-linux-x64.tar.gz   # or unzip airllm-chat-macos.zip"
            echo "./airllm-chat --model <model_path>"
            echo ""
            echo "# Windows"
            echo "# Extract airllm-chat-windows-x64.zip, then run airllm-chat.exe"
            echo '```'
            echo ""
            echo "### SHA256 Verification"
            echo ""
            echo '```bash'
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
          } > .release-notes-auto.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.new_tag }}
          name: "AirLLM Chat ${{ needs.bump-version.outputs.new_tag }}"
          body_path: .release-notes-auto.md
          draft: false
          prerelease: false
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Release summary
        run: |
          echo "## 🎉 Release ${{ needs.bump-version.outputs.new_tag }} published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | File |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows x64 | \`airllm-chat-windows-x64.zip\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux x64 | \`airllm-chat-linux-x64.tar.gz\` |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | \`airllm-chat-macos.zip\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`airllm-chat-src.tar.gz\` / \`airllm-chat-src.zip\` |" >> $GITHUB_STEP_SUMMARY
