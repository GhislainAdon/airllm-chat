# ============================================================
# AirLLM Chat - GitHub Actions Release Pipeline
#
# Triggers: Push a tag like "v1.0.0" to build & release all binaries
# Builds:   Windows (.exe), Linux (AppImage + binary), macOS (app),
#           Source tarball
# Release:  Automatic GitHub Release with all artifacts
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v*'  # e.g. v1.0.0, v1.2.3-beta

permissions:
  contents: write

env:
  APP_NAME: airllm-chat
  PYTHON_VERSION: '3.11'

jobs:
  # ==============================================
  # JOB 1: Build Windows .exe (64-bit)
  # ==============================================
  build-windows:
    name: 🪟 Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install airllm torch --index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller airllm-chat.spec --clean --noconfirm

      - name: Create ZIP archive
        run: |
          cd dist/airllm-chat
          7z a -tzip ..\airllm-chat-windows-x64.zip .
          cd ../..

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/airllm-chat-windows-x64.zip
          retention-days: 5

  # ==============================================
  # JOB 2: Build Linux binary + AppImage
  # ==============================================
  build-linux:
    name: 🐧 Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev \
            libgl1-mesa-glx \
            patchelf \
            file \
            desktop-file-utils \
            fuse \
            fuse2fs \
            AppImageKit || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install airllm torch --index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller airllm-chat.spec --clean --noconfirm

      - name: Create tar.gz archive
        run: |
          cd dist/airllm-chat
          tar -czf ../airllm-chat-linux-x64.tar.gz .
          cd ../..

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/airllm-chat-linux-x64.tar.gz
          retention-days: 5

  # ==============================================
  # JOB 3: Build macOS app bundle
  # ==============================================
  build-macos:
    name: 🍎 macOS x64 / ARM64
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install airllm torch --index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller
          pip install py2app || true

      - name: Build with PyInstaller
        run: |
          pyinstaller airllm-chat.spec --clean --noconfirm

      - name: Create ZIP archive
        run: |
          cd dist/airllm-chat
          zip -r ../airllm-chat-macos.zip .
          cd ../..

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/airllm-chat-macos.zip
          retention-days: 5

  # ==============================================
  # JOB 4: Source distribution
  # ==============================================
  build-source:
    name: 📦 Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source tarball
        run: |
          # Create clean source distribution (exclude build artifacts)
          tar --exclude='.git' \
              --exclude='venv' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='.DS_Store' \
              --exclude='build' \
              --exclude='dist' \
              -czf ../airllm-chat-src.tar.gz .

          # Also create zip
          zip -r ../airllm-chat-src.zip . \
            -x '.git/*' \
            -x 'venv/*' \
            -x '__pycache__/*' \
            -x '*.pyc' \
            -x '.DS_Store' \
            -x 'build/*' \
            -x 'dist/*'

          mv ../airllm-chat-src.tar.gz ./airllm-chat-src.tar.gz
          mv ../airllm-chat-src.zip ./airllm-chat-src.zip

      - name: Generate SHA256 checksums
        run: |
          sha256sum airllm-chat-src.tar.gz > airllm-chat-src.tar.gz.sha256
          sha256sum airllm-chat-src.zip > airllm-chat-src.zip.sha256

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            airllm-chat-src.tar.gz
            airllm-chat-src.tar.gz.sha256
            airllm-chat-src.zip
            airllm-chat-src.zip.sha256
          retention-days: 5

  # ==============================================
  # JOB 5: Create GitHub Release with all artifacts
  # ==============================================
  release:
    name: 🚀 Create Release
    needs:
      - build-windows
      - build-linux
      - build-macos
      - build-source
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download all build artifacts
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-artifacts/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release-artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: release-artifacts/

      - name: Download Source artifact
        uses: actions/download-artifact@v4
        with:
          name: source
          path: release-artifacts/

      - name: Generate final checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          echo "## Checksums (SHA256)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_clean=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AirLLM Chat ${{ steps.version.outputs.version }}"
          body_path: .github/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## 🎉 Release ${{ steps.version.outputs.version }} published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | File |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows x64 | \`airllm-chat-windows-x64.zip\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux x64 | \`airllm-chat-linux-x64.tar.gz\` |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | \`airllm-chat-macos.zip\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`airllm-chat-src.tar.gz\` / \`airllm-chat-src.zip\` |" >> $GITHUB_STEP_SUMMARY
